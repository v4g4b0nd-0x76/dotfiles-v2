# Kuro Nezumi — portable terminal palette.
# scripts/kuro-nvim supplies one original pixel background per session.
font-family = Fira Code
font-family = Noto Sans Mono CJK JP
font-size = 14

background = #050505
foreground = #cdc4ba
cursor-color = #cdc4ba
cursor-text = #050505
selection-background = #2a1818
selection-foreground = #cdc4ba

background-image-opacity = 0.18
background-image-fit = cover
background-image-position = bottom-right

palette = 0=#050505
palette = 1=#b73535
palette = 2=#8a8f73
palette = 3=#b8a781
palette = 4=#8c9097
palette = 5=#9a7f8f
palette = 6=#7f9693
palette = 7=#cdc4ba
palette = 8=#45413c
palette = 9=#d94a4a
palette = 10=#a5ab88
palette = 11=#cfbd91
palette = 12=#a9adb5
palette = 13=#b494a7
palette = 14=#96aeaa
palette = 15=#e8e0d5
