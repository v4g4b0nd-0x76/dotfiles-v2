[window]
opacity = 0.95
decorations = "Buttonless"

[scrolling]
history = 100000

[cursor]
style = { shape = "Beam", blinking = "Never" }

[font]
size = 16

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[bell]
animation = "EaseOutExpo"
duration = 0
color = "#000000"

[general]
live_config_reload = true
import = [
    "~/.config/alacritty/themes/gruvbox-material-dark-hard.toml"
]
